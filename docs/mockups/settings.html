<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>뉴스레터 설정 관리 시안 - 뉴스레터</title>
    <link rel="stylesheet" href="../../src/Newsletter/wwwroot/lib/bootstrap/dist/css/bootstrap.min.css" />
    <style>
        body { background-color: #F8F9FA; }
        .mockup-bar { background-color: #6C757D; color: #FFFFFF; padding: 8px 16px; font-size: 14px; }
        .app-wrapper { display: flex; min-height: calc(100vh - 47px); }
        .app-nav { width: 220px; flex-shrink: 0; background-color: #212529; color: #FFFFFF; display: flex; flex-direction: column; padding: 24px 16px; }
        .app-nav .nav-link { color: #FFFFFF; }
        .app-content { flex-grow: 1; padding: 32px; }
        .app-content-inner { max-width: 960px; margin: 0 auto; }
        .settings-area { width: 480px; margin: 0 auto; }
        .time-select { width: 110px; }
    </style>
</head>
<body>
    <!-- 시안 전용: 상태를 바꿔 보는 막대. 실제 화면에는 없다 -->
    <div class="mockup-bar">
        <span class="me-2">시안 상태 보기 (실제 화면에는 없음):</span>
        <select id="state-select" class="form-select form-select-sm d-inline-block w-auto">
            <option value="loaded">불러옴 (바꾼 값 없음)</option>
            <option value="loading">로딩 중</option>
            <option value="changed">바꾼 값 있음</option>
            <option value="invalid">시간 오류 (생성 ≥ 발송)</option>
            <option value="saving">저장 중</option>
            <option value="saved">저장 성공</option>
            <option value="server-error">서버 오류</option>
        </select>
    </div>

    <div class="app-wrapper">
        <nav class="app-nav">
            <div class="fs-5 mb-4">뉴스레터</div>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="#" class="nav-link">뉴스레터 발송</a></li>
                <li class="nav-item"><a href="#" class="nav-link">수신자 관리</a></li>
                <li class="nav-item"><a href="#" class="nav-link active">뉴스레터 설정 관리</a></li>
                <li class="nav-item"><a href="#" class="nav-link">히스토리</a></li>
            </ul>
            <button type="button" class="btn btn-outline-light btn-sm w-100">로그아웃</button>
        </nav>

        <main class="app-content">
            <div class="app-content-inner">
                <div class="settings-area">
                    <h1 class="h4 mb-3">뉴스레터 설정 관리</h1>

                    <div id="page-alert" class="alert d-none" role="alert"></div>

                    <p id="settings-loading" class="text-secondary d-none">불러오는 중...</p>
                    <div id="settings-card" class="card">
                        <div class="card-body p-4">
                            <div class="mb-3">
                                <label class="form-label">자동 생성 시간</label>
                                <div class="d-flex align-items-center gap-2">
                                    <select id="generate-hour" class="form-select time-select"></select>
                                    <span>시</span>
                                    <select id="generate-minute" class="form-select time-select"></select>
                                    <span>분</span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">자동 발송 시간</label>
                                <div class="d-flex align-items-center gap-2">
                                    <select id="send-hour" class="form-select time-select"></select>
                                    <span>시</span>
                                    <select id="send-minute" class="form-select time-select"></select>
                                    <span>분</span>
                                </div>
                                <div id="time-error" class="text-danger small mt-1 d-none">생성 시간은 발송 시간보다 앞서야 합니다.</div>
                            </div>

                            <p class="small text-secondary mb-4">한국 시간(KST) 기준이며, 평일(주말·공휴일 제외)에만 자동으로 생성·발송합니다.</p>

                            <button type="button" id="btn-save" class="btn btn-primary w-100">저장</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 시안 전용: 상태별 화면을 보여주기 위한 코드. 실제 기능 코드가 아니다
        function byId(id) { return document.getElementById(id); }

        function fillOptions(select, max) {
            for (let value = 0; value <= max; value++) {
                const option = document.createElement('option');
                option.value = String(value).padStart(2, '0');
                option.textContent = option.value;
                select.appendChild(option);
            }
        }

        fillOptions(byId('generate-hour'), 23);
        fillOptions(byId('generate-minute'), 59);
        fillOptions(byId('send-hour'), 23);
        fillOptions(byId('send-minute'), 59);

        function setTimes(generateHour, generateMinute, sendHour, sendMinute) {
            byId('generate-hour').value = generateHour;
            byId('generate-minute').value = generateMinute;
            byId('send-hour').value = sendHour;
            byId('send-minute').value = sendMinute;
        }

        function applyState(state) {
            const selects = ['generate-hour', 'generate-minute', 'send-hour', 'send-minute'];
            selects.forEach(function (id) { byId(id).classList.remove('is-invalid'); });
            byId('time-error').classList.add('d-none');
            byId('page-alert').className = 'alert d-none';
            byId('settings-loading').classList.toggle('d-none', state !== 'loading');
            byId('settings-card').classList.toggle('d-none', state === 'loading');
            byId('btn-save').textContent = '저장';
            setTimes('07', '50', '08', '00');
            byId('btn-save').disabled = true;

            if (state === 'changed') {
                setTimes('06', '30', '07', '00');
                byId('btn-save').disabled = false;
            } else if (state === 'invalid') {
                setTimes('08', '10', '08', '00');
                selects.forEach(function (id) { byId(id).classList.add('is-invalid'); });
                byId('time-error').classList.remove('d-none');
            } else if (state === 'saving') {
                setTimes('06', '30', '07', '00');
                byId('btn-save').textContent = '저장 중...';
            } else if (state === 'saved') {
                setTimes('06', '30', '07', '00');
                byId('page-alert').className = 'alert alert-success';
                byId('page-alert').textContent = '설정을 저장했습니다.';
            } else if (state === 'server-error') {
                setTimes('06', '30', '07', '00');
                byId('btn-save').disabled = false;
                byId('page-alert').className = 'alert alert-danger';
                byId('page-alert').textContent = '오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
            }
        }

        byId('state-select').addEventListener('change', function (event) { applyState(event.target.value); });
        applyState('loaded');
    </script>
</body>
</html>
